<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 973 256" width="973" height="256" role="img" aria-labelledby="title">
  <title id="title">OTPWala</title>
  <!-- Brand mark and wordmark proportions match the OTPWala site logo. -->
    <svg x="20" y="16" viewBox="16 16 480 480" width="224" height="224">
      
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Electric Sapphire -->
    <linearGradient id="brandFullBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Radial Core Highlight -->
    <radialGradient id="brandFullCenterGlow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- The "O" Ring Gradient -->
    <linearGradient id="brandFullORingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>

    <!-- "W" Monogram Left Wing -->
    <linearGradient id="brandFullWLeftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- "W" Monogram Right Wing -->
    <linearGradient id="brandFullWRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Center Security Core Gradient -->
    <linearGradient id="brandFullVaultCoreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="brandFullMainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#020617" flood-opacity="0.5" />
    </filter>

    <filter id="brandFullSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle with Precision Border -->
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#brandFullBg)" />
  <rect x="16" y="16" width="480" height="480" rx="118" fill="url(#brandFullCenterGlow)" />
  <rect x="18" y="18" width="476" height="476" rx="116" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="3" />

  <!-- Glass Arc Sheen on Top Half -->
  <path d="M 16 134 C 16 50 50 16 134 16 L 378 16 C 462 16 496 50 496 134 L 496 220 C 330 255 182 255 16 220 Z" fill="#ffffff" opacity="0.08" />

  <!-- Main Emblem Group -->
  <g>
    
    <!-- 1. The Sculpted Outer "O" Shield Ring -->
    <path 
      d="M 256,76 
         C 358,76 436,154 436,256 
         C 436,334 372,398 256,436 
         C 140,398 76,334 76,256 
         C 76,154 154,76 256,76 Z
         M 256,134
         C 188,134 134,188 134,256
         C 134,312 180,360 256,388
         C 332,360 378,312 378,256
         C 378,188 324,134 256,134 Z" 
      fill="url(#brandFullORingGrad)" 
      fill-rule="evenodd"
    />

    <!-- 2. The Integrated "W" Monogram (Wala) -->
    <!-- Left Wing of W -->
    <path 
      d="M 172,216
         L 208,216
         L 236,326
         L 204,326
         Z" 
      fill="url(#brandFullWLeftGrad)"
    />
    <!-- Center Left Wing -->
    <path 
      d="M 204,326
         L 236,326
         L 256,254
         L 238,254
         Z" 
      fill="#60a5fa"
    />
    <!-- Center Right Wing -->
    <path 
      d="M 256,254
         L 274,254
         L 308,326
         L 276,326
         Z" 
      fill="#3b82f6"
    />
    <!-- Right Wing of W -->
    <path 
      d="M 304,216
         L 340,216
         L 308,326
         L 276,326
         Z" 
      fill="url(#brandFullWRightGrad)"
    />

    <!-- Top Connection Cap of W -->
    <rect x="172" y="212" width="36" height="6" rx="3" fill="#ffffff" />
    <rect x="304" y="212" width="36" height="6" rx="3" fill="#ffffff" />

    <!-- 3. The Security Core: Vault Lock Keyhole & Verification Indicator -->
    <g filter="url(#brandFullSoftGlow)">
      <!-- Keyhole circle head -->
      <circle cx="256" cy="186" r="16" fill="url(#brandFullVaultCoreGrad)" />
      <!-- Keyhole stem pointing into W -->
      <path 
        d="M 248,194 
           L 264,194 
           L 267,222 
           L 245,222 
           Z" 
        fill="url(#brandFullVaultCoreGrad)" 
      />
    </g>

    <!-- Center Pulse Checkmark Accent in the Core -->
    <polyline 
      points="250,186 254,190 262,182" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="2.8" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />

    <!-- 4. Concentric Verification Carrier Beacons (Top Right) -->
    <!-- Signal Wave 1 -->
    <path 
      d="M 364,136 C 382,152 392,174 394,198" 
      fill="none" 
      stroke="#38bdf8" 
      stroke-width="8" 
      stroke-linecap="round" 
    />
    <!-- Signal Wave 2 -->
    <path 
      d="M 396,108 C 422,132 436,162 438,198" 
      fill="none" 
      stroke="#38bdf8" 
      stroke-width="8" 
      stroke-linecap="round" 
      opacity="0.8" 
    />

    <!-- Verification Live Dot -->
    <circle cx="406" cy="98" r="9" fill="#10b981" />
    <circle cx="406" cy="98" r="4.5" fill="#ffffff" />
  </g>

    </svg>
  <!-- Typography outlined as paths so the logo is font-independent. -->
